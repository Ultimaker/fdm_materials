name: conan-package

on:
  workflow_dispatch:
  push:
    paths:
      - '*.xml.*'
      - '*.sig'
      - 'conanfile.py'
      - 'conandata.yml'
      - '.github/workflows/conan-package.yml'
      - '.github/workflows/requirements*.txt'
    branches:
      - main
      - master
      - 'CURA-*'
      - 'PP-*'
      - 'NP-*'
      - '[0-9].[0-9]*'
      - '[0-9].[0-9][0-9]*'

jobs:
  conan-package:
    uses: ultimaker/cura-workflows/.github/workflows/conan-package.yml@main
    with:
      platform_windows: false
      platform_mac: false
      install_system_dependencies: false
      private_data: true
    secrets: inherit

  export-unimotion-testing:
    uses: ultimaker/cura-workflows/.github/workflows/conan-recipe-export.yml@main
    with:
      version: "5.15.0-alpha.36+unimotion"
      user: "unimotion"
      channel: "testing"
      private_data: true
    secrets: inherit

  signal-curator:
    needs: conan-package
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Curator Workflow
      run: |
        gh workflow run --repo ultimaker/curator -r CURA-13401-unimotion package.yml
      env:
        GITHUB_TOKEN: ${{ secrets.CURATOR_TRIGGER_PAT_C3PO }}
